<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Meu dia</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F4;--card:#fff;--ink:#1E2B2F;--mut:#66767B;--ln:#E3E7E4;--ac:#0E6F6A;--acs:#E1F0EE;--u:#C8402B;--a:#D98324;--n:#3B7DD8;--b:#8A969A;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141A1C;--card:#1D2629;--ink:#E8EEEE;--mut:#93A3A7;--ln:#2B373A;--ac:#4FC2B9;--acs:#1F3A38}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}
nav{width:230px;padding:18px 12px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto}
nav a{padding:8px 12px;border-radius:8px;color:var(--mut);cursor:pointer;font-weight:500}nav a.on{background:var(--acs);color:var(--ac)}nav .pri{margin-bottom:14px;padding:10px}
main{flex:1;padding:28px;min-width:0;overflow-y:auto}
@media(max-width:800px){body{flex-direction:column;height:auto}nav{width:100%;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:8px}nav a,nav .pri{white-space:nowrap;margin:0}main{padding:16px}.two{grid-template-columns:1fr!important}}
h1{font-size:26px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:14px}.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.stat b{font-size:26px;display:block;line-height:1.1}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.t{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--ln);border-left:4px solid var(--b);border-radius:8px;background:var(--card);margin-bottom:6px;cursor:grab}
.t.urgent{border-left-color:var(--u)}.t.high{border-left-color:var(--a)}.t.normal{border-left-color:var(--n)}.t button{padding:2px 8px}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acs);color:var(--ac);margin-left:4px;font-weight:500}.pill.l{background:var(--u);color:#fff}
.warn{background:color-mix(in srgb,var(--u) 14%,var(--card));border:1px solid var(--u);padding:10px 14px;border-radius:10px;margin-bottom:14px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:color-mix(in srgb,var(--ln) 45%,transparent);border-radius:12px;padding:10px;min-height:160px}.over{outline:2px dashed var(--ac)}
#ov{position:fixed;inset:0;background:#0008;display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:5vh 12px;z-index:9}#ov.on{display:flex}.mod{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:560px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}input,select,textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}input[type=checkbox],input[type=radio]{width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}.mut{color:var(--mut);font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools select,.tools input{width:auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;display:none;z-index:10;max-width:90%}
@media(prefers-reduced-motion:no-preference){.mod{animation:in .15s ease-out}@keyframes in{from{transform:translateY(6px);opacity:0}}}
</style></head><body><nav id="nav"></nav><main id="main"></main><div id="ov"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const aD=(k,n)=>{const d=new Date(k+'T12:00');d.setDate(d.getDate()+n);return dk(d)};
const fd=k=>k?k.split('-').reverse().join('/'):'—',tm=s=>{const[a,b]=s.split(':');return+a*60+ +b},mt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const fdt=iso=>{const d=new Date(iso);return fd(dk(d))+' '+mt(d.getHours()*60+d.getMinutes())};
const DS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'],DA=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const PR={urgent:'Urgente',high:'Alta',normal:'Normal',low:'Baixa'},PO={urgent:0,high:1,normal:2,low:3};
const COLS=[['inbox','Caixa de entrada'],['today','Planejadas para hoje'],['doing','Em andamento'],['waiting','Aguardando retorno'],['done','Concluídas'],['postponed','Adiadas']];
const today=()=>dk(),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const def=()=>({setup:0,cfg:{ini:'08:00',fim:'18:00',almI:'12:00',alm:90,dias:[1,2,3,4,5],foco:90,res:60,cats:['Criação de conteúdo','Vídeo','Design','Campanhas','Site','Reuniões','Administrativo'],
blocks:[[1,'Planejamento do dia','08:00','08:15'],[2,'Bloco de foco','08:15','10:00'],[3,'Revisão de demandas','10:00','10:15'],[4,'Execução de tarefas','10:15','12:00'],[5,'Almoço','12:00','13:30',1],[6,'Execução de tarefas','13:30','15:00'],[7,'Revisão de solicitações','15:00','15:15'],[8,'Execução e finalização','15:15','17:30'],[9,'Fechamento do dia','17:30','18:00']].map(a=>({id:a[0],l:a[1],s:a[2],e:a[3],lunch:!!a[4]}))},tasks:[],notes:{},close:{},top:{},log:[]});
let S;try{S=JSON.parse(localStorage.getItem('meudia'))}catch(e){}if(!S||!S.cfg)S=def();
let tt;const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',4000)};
const save=()=>{try{localStorage.setItem('meudia',JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste navegador: os dados só duram até fechar a página.')}};
const T=id=>S.tasks.find(t=>t.id==id),lg=(k,id,d)=>S.log.push({d:d||today(),k,id}),hs=(t,x)=>(t.hist=t.hist||[]).push({at:new Date().toISOString(),x});
const est=t=>+t.est||30,open=t=>!['done','cancel'].includes(t.status),act=t=>['today','doing'].includes(t.status);
const cap=()=>{const c=S.cfg;return Math.max(0,tm(c.fim)-tm(c.ini)-c.alm-c.res)};
const plannedOn=d=>S.tasks.filter(t=>t.date==d&&act(t)),used=d=>plannedOn(d).reduce((a,t)=>a+est(t),0);
const late=t=>open(t)&&((t.due&&t.due<today())||(t.date&&t.date<today()&&act(t)));
const fm=m=>m>=60?Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):''):m+'min';
const workday=d=>S.cfg.dias.includes(new Date(d+'T12:00').getDay());
const nextW=d=>{let x=aD(d,1);for(let i=0;i<7&&!workday(x);i++)x=aD(x,1);return x},prevW=d=>{let x=aD(d,-1);for(let i=0;i<7&&!workday(x);i++)x=aD(x,-1);return x};
const doneTo=()=>S.tasks.filter(t=>t.status=='done'&&t.doneAt&&dk(new Date(t.doneAt))==today());
const lbl=s=>(COLS.find(c=>c[0]==s)||[0,s])[1],opt=(a,v)=>a.map(([k,l])=>`<option value="${H(k)}" ${k==v?'selected':''}>${H(l)}</option>`).join('');
const catOpt=v=>opt([['','Sem categoria'],...S.cfg.cats.map(c=>[c,c])],v);
function sug(t){let s=0,r=[];if(t.due){const n=Math.round((new Date(t.due+'T12:00')-new Date(today()+'T12:00'))/864e5);if(n<0){s+=4;r.push('prazo vencido')}else if(n==0){s+=3;r.push('vence hoje')}else if(n<=2){s+=2;r.push('prazo em '+n+' dia(s)')}else if(n<=5){s++;r.push('prazo nesta semana')}}
if(t.impact=='3'){s+=2;r.push('impacto alto')}else if(t.impact=='2'){s++;r.push('impacto médio')}if(t.blocks){s++;r.push('outras pessoas dependem')}if(est(t)>240)r.push('tarefa longa, considere dividir');
return{p:s>=6?'urgent':s>=4?'high':s>=1?'normal':'low',r:r.length?r:['sem prazo nem impacto informados']}}
const addTask=v=>{const t=Object.assign({id:uid(),status:'inbox',prio:'normal',created:new Date().toISOString(),hist:[],subs:[]},v);S.tasks.push(t);lg('created',t.id);return t};
function demo(){const t0=today(),n=o=>Object.assign({id:uid(),status:'inbox',prio:'normal',created:new Date().toISOString(),demo:true,hist:[],subs:[]},o);
S.tasks.push(n({title:'Carrossel educativo para o Instagram',cat:'Criação de conteúdo',status:'today',date:t0,est:90,prio:'high',due:t0}),n({title:'Editar Reels do evento',cat:'Vídeo',status:'doing',date:t0,est:120,due:aD(t0,2)}),n({title:'Revisar legendas da semana',cat:'Criação de conteúdo',status:'today',date:t0,est:30,prio:'low'}),n({title:'Atualizar banner do site',cat:'Site',who:'Carla',est:45,due:aD(t0,1),impact:'2'}),n({title:'Aprovação da arte do story',cat:'Design',status:'waiting',who:'Diretoria'}),n({title:'Organizar arquivos da campanha',cat:'Administrativo',status:'postponed',est:60}))}
/* modais */
const modal=h=>{$('#ov').innerHTML=`<div class="mod">${h}</div>`;$('#ov').classList.add('on')},closeM=()=>{$('#ov').classList.remove('on');$('#ov').innerHTML=''};
const ask=(msg,a,id,ok)=>modal(`<h2>${msg}</h2><div class="row" style="margin-top:14px"><button class="pri" data-a="${a}" data-id="${id}">${ok}</button><button data-a="close">Voltar</button></div>`);
/* ações sobre tarefas */
function fin(id){const t=T(id);t.status='done';t.doneAt=new Date().toISOString();if(!t.date)t.date=today();lg('done',id);hs(t,'Concluída');save();closeM();render();toast('Concluída. Progresso do dia atualizado.')}
function mv(id,st){const t=T(id);if(!t||t.status==st)return;if(st=='done')return fin(id);if(st=='today'&&t.status!='doing')return planModal(id);
t.status=st;if(st=='doing'&&!t.date)t.date=today();if(st=='postponed'||st=='inbox'){t.date=null;t.blk=null}hs(t,'Movida para '+lbl(st));save();render()}
function setDay(id,d){const t=T(id);t.date=d;if(!act(t)&&t.status!='done')t.status='today';hs(t,'Planejada para '+fd(d));lg('planned',id,d);save();render();if(used(d)>cap())toast('Atenção: '+fd(d)+' passou da capacidade do dia.')}
function setBlk(id,b){const t=T(id);t.blk=+b||null;if(b&&!['today','doing','done'].includes(t.status)){save();return planModal(id)}if(b&&t.status!='done')t.date=today();save();render()}
function planModal(id,d=today()){const t=T(id),u=used(d)-(act(t)&&t.date==d?est(t):0),c=cap(),ov=u+est(t)-c;const af=plannedOn(d).filter(x=>x.id!=id&&PO[x.prio]>PO[t.prio]).sort((a,b)=>PO[b.prio]-PO[a.prio]);
modal(`<h2>Planejar "${H(t.title)}" para ${fd(d)}?</h2><p>Capacidade do dia: ${fm(c)}. Já planejado: ${fm(u)}. Esta tarefa: ${fm(est(t))}.</p>`+(ov>0?`<div class="warn"><b>Isso passa da capacidade em ${fm(ov)}.</b> Tarefas já planejadas que podem ser afetadas:</div>`+(af.length?af.map(x=>`<div class="t ${x.prio}"><span style="flex:1">${H(x.title)} <span class="mut">${PR[x.prio]}, ${fm(est(x))}</span></span><button data-a="push" data-id="${x.id}" data-t="${id}">Adiar para ${fd(nextW(d))}</button></div>`).join(''):'<p class="mut">Não há tarefas de prioridade menor para adiar.</p>')+`<p class="mut">Outra saída: negociar um novo prazo${t.who?' com '+H(t.who):''}.</p>`:'')+
`<div class="row" style="margin-top:14px"><button class="pri" data-a="conf" data-id="${id}" data-d="${d}">${ov>0?'Planejar mesmo assim':'Planejar'}</button><button data-a="close">Manter fora do plano</button></div>`)}
function reschedModal(id){const t=T(id);modal(`<form data-f="resched" data-id="${id}"><h2>Reagendar "${H(t.title)}"</h2><label>Nova data</label><input type="date" name="d" value="${nextW(today())}"><label><input type="checkbox" name="nodate"> Adiar sem data</label><label>Motivo (opcional)</label><input name="why"><div class="row" style="margin-top:14px"><button class="pri">Reagendar</button><button type="button" data-a="close">Cancelar</button></div></form>`)}
function taskForm(t){const sg=t?sug(t):0;modal(`<form data-f="task" data-id="${t?t.id:''}"><h2>${t?'Editar demanda':'Nova demanda'}</h2><label>Título</label><input name="title" required autofocus value="${H(t?.title)}">
<div class="row"><div><label>Quem pediu</label><input name="who" value="${H(t?.who)}"></div><div><label>Prazo</label><input type="date" name="due" value="${t?.due||''}"></div></div>
<div class="row"><div><label>Prioridade</label><select name="prio">${opt(Object.entries(PR),t?.prio||'normal')}</select></div><div><label>Tempo estimado (min)</label><input type="number" name="est" min="5" step="5" value="${t?.est||''}"></div></div><div id="sg" class="mut" style="margin-top:6px"></div>
<details ${t?'open':''}><summary style="cursor:pointer;margin-top:10px">Mais detalhes</summary><div class="row"><div><label>Categoria</label><select name="cat">${catOpt(t?.cat)}</select></div><div><label>Impacto</label><select name="impact">${opt([['','Não informado'],['1','Baixo'],['2','Médio'],['3','Alto']],t?.impact)}</select></div></div>
<label><input type="checkbox" name="blocks" ${t?.blocks?'checked':''}> Outras pessoas dependem desta entrega</label>${t?`<label>Tempo real gasto (min)</label><input type="number" name="real" min="0" value="${t.real||''}">`:''}
<label>Descrição</label><textarea name="desc" rows="2">${H(t?.desc)}</textarea><label>Observações</label><textarea name="notes" rows="2">${H(t?.notes)}</textarea>
<label>Subtarefas</label><div id="subs">${[...(t?.subs||[]),{t:'',d:0}].map(s=>`<div class="row sub" style="margin-bottom:4px;flex-wrap:nowrap"><input type="checkbox" class="sd" style="flex:0" ${s.d?'checked':''}><input class="st" value="${H(s.t)}" placeholder="Nova subtarefa"></div>`).join('')}</div>
${t?`<p class="mut">Entrou em ${fdt(t.created)}.${(t.hist||[]).length?' Histórico: '+t.hist.map(h=>fdt(h.at)+' '+H(h.x)).join('; '):''}</p>`:''}</details>
<div class="row" style="margin-top:14px"><button class="pri">Salvar</button><button type="button" data-a="close">Cancelar</button>${t?`<button type="button" data-a="ask" data-do="del" data-id="${t.id}">Excluir</button>`:''}</div></form>`);if(t)sugUpd($('#ov form'))}
function sugUpd(f){const t={due:f.elements.due.value,impact:f.elements.impact.value,blocks:f.elements.blocks.checked,est:f.elements.est.value},s=sug(t);$('#sg').innerHTML=`Sugestão: <b>${PR[s.p]}</b> (${s.r.join(', ')}) <button type="button" data-a="usesug" data-id="${s.p}">Usar</button>`}
function prefsForm(first){const c=S.cfg;return `<form data-f="prefs" data-first="${first?1:0}"><h2>${first?'Vamos configurar sua jornada':'Preferências'}</h2><div class="row"><div><label>Início</label><input type="time" name="ini" value="${c.ini}"></div><div><label>Fim</label><input type="time" name="fim" value="${c.fim}"></div><div><label>Almoço: início</label><input type="time" name="almI" value="${c.almI}"></div><div><label>Almoço: duração (min)</label><input type="number" name="alm" min="0" value="${c.alm}"></div></div>
<label>Dias úteis</label><div class="row">${DA.map((n,i)=>`<label style="margin:0"><input type="checkbox" class="d" value="${i}" ${c.dias.includes(i)?'checked':''}> ${n}</label>`).join('')}</div>
<label>Categorias (uma por linha)</label><textarea name="cats" rows="5">${H(c.cats.join('\n'))}</textarea><div class="row"><div><label>Duração padrão do bloco de foco (min)</label><input type="number" name="foco" min="15" value="${c.foco}"></div><div><label>Reserva diária para imprevistos (min)</label><input type="number" name="res" min="0" value="${c.res}"></div></div>
${first?'<label><input type="checkbox" name="demo" checked> Incluir tarefas de exemplo (marcadas e removíveis)</label>':''}<div class="row" style="margin-top:14px"><button class="pri">Salvar</button>${first?'':'<button type="button" data-a="close">Cancelar</button>'}</div></form>`}
/* componentes */
const star=t=>`<button data-a="top" data-id="${t.id}" title="Prioridade essencial do dia">${(S.top[today()]||[]).includes(t.id)?'★':'☆'}</button>`;
const card=(t,o={})=>{const ds=(t.subs||[]).filter(s=>s.d).length;return `<div class="t ${t.prio}" draggable="true" data-id="${t.id}"><div style="flex:1;min-width:0"><b data-a="edit" data-id="${t.id}" style="cursor:pointer">${H(t.title)}</b>${t.demo?'<span class="pill">Exemplo</span>':''}${late(t)?'<span class="pill l">Atrasada</span>':''}
<div class="mut">${PR[t.prio]}${t.cat?', '+H(t.cat):''}${t.who?', '+H(t.who):''}${t.due?', prazo '+fd(t.due):''}${t.est?', '+fm(+t.est):''}${o.d&&t.date?', dia '+fd(t.date):''}${(t.subs||[]).length?', subtarefas '+ds+'/'+t.subs.length:''}</div>${o.x||''}</div>
${o.btn===0?'':open(t)?star(t)+`<button data-a="done" data-id="${t.id}" title="Concluir">✓</button><button data-a="resched" data-id="${t.id}" title="Reagendar">↻</button>`:''}${o.btn||''}</div>`};
const list=(a,o,em)=>a.length?a.map(t=>card(t,o)).join(''):`<p class="mut">${em||'Nada por aqui.'}</p>`;
const byP=(a,b)=>PO[a.prio]-PO[b.prio]||(a.due||'9').localeCompare(b.due||'9');
const stat=(n,l)=>`<div class="card stat"><b>${n}</b><span class="mut">${l}</span></div>`;
/* páginas */
let page=(location.hash||'#dash').slice(1),wk=0,F={d:'',p:'',c:'',q:'',s:''};const V={};
V.dash=()=>{const d=today(),h=new Date().getHours(),dn=doneTo(),pend=plannedOn(d),pl=[...pend,...dn.filter(x=>!pend.includes(x))],pct=pl.length?Math.round(dn.length/pl.length*100):0;
const ov=S.tasks.filter(late),inb=S.tasks.filter(t=>t.status=='inbox'),wt=S.tasks.filter(t=>t.status=='waiting'),u=used(d),c=cap(),B=S.cfg.blocks;
let top=(S.top[d]||[]).map(T).filter(t=>t&&open(t)),tl='Suas três prioridades';if(!top.length){top=pend.slice().sort(byP).slice(0,3);tl='Sugestão de prioridades (marque ★ para escolher as suas)'}
const nx=pend.slice().sort((a,b)=>(B.find(x=>x.id==a.blk)?.s||'99').localeCompare(B.find(x=>x.id==b.blk)?.s||'99')||byP(a,b))[0];
return `<h1>${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}!</h1><p class="mut">${DS[new Date().getDay()]}, ${fd(d)}. ${workday(d)?`${pl.length} tarefas no plano, ${dn.length} concluídas.`:'Hoje não é dia útil nas suas preferências.'}</p>
${u>c?`<div class="warn"><b>Planejamento acima da capacidade:</b> ${fm(u)} planejados para ${fm(c)} disponíveis (já descontada a reserva de ${fm(S.cfg.res)}). Reveja o plano ou reagende algo.</div>`:''}
<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>Progresso do dia: ${pct}%</b><span class="mut">Capacidade: ${fm(u)} de ${fm(c)}</span></div><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>
<div class="grid">${stat(pl.length,'Planejadas')}${stat(dn.length,'Concluídas')}${stat(pend.length,'Pendentes')}${stat(ov.length,'Atrasadas')}${stat(inb.length,'Novas sem priorizar')}</div>
<div class="two"><div><div class="card" style="margin-bottom:14px"><h2>${tl}</h2>${list(top,{},'Nenhuma tarefa planejada ainda.')}</div>

document.addEventListener('change',e=>{const s=e.target,d=s.dataset;if(d.mv&&s.value){const[k,v]=s.value.split(':');k=='st'?mv(d.mv,v):setBlk(d.mv,v)}else if(d.pr){const t=T(d.pr);hs(t,'Prioridade: '+PR[t.prio]+' → '+PR[s.value]);t.prio=s.value;save();render()}else if(d.flt){F[d.flt]=s.value;render()}});
document.addEventListener('input',e=>{if(e.target.id=='note'){S.notes[today()]=e.target.value;save()}else if(e.target.form?.dataset.f=='task'&&$('#sg'))sugUpd(e.target.form)});
let dragId;document.addEventListener('dragstart',e=>{const t=e.target.closest?.('.t[data-id]');if(t){dragId=t.dataset.id;e.dataTransfer.setData('text/plain',dragId)}});
